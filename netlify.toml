# Production deployment for TUNES Alltagshilfe & Betreuung.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.4"
  NEXT_PUBLIC_SITE_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://www.tunesalltagshilfe.de"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
